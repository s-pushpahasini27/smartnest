<article class="property-card" data-property-id="{{ prop.id }}">
<div class="card-image"><a href="{{ url_for('property_detail', prop_id=prop.id, **filters) }}"><img src="{{ prop.image }}" alt="{{ prop.title }}" loading="lazy" width="640" height="440" data-property-image></a><span class="image-tag">{{ prop.bedrooms }} bedroom{{ 's' if prop.bedrooms > 1 }}</span><button class="save-button" type="button" data-save="{{ prop.id }}" aria-pressed="false" aria-label="Save {{ prop.title }}">♡</button></div>
<div class="card-content"><p class="location">{{ prop.location }}</p><h3><a href="{{ url_for('property_detail', prop_id=prop.id, **filters) }}">{{ prop.title }}</a></h3><p class="price">{{ prop.price|money }}</p><div class="specs"><span>{{ prop.bedrooms }} beds</span><span>{{ prop.bathrooms }} baths</span><span>{{ '{:,}'.format(prop.area) }} sq ft</span></div><a class="text-link" href="{{ url_for('property_detail', prop_id=prop.id, **filters) }}">Explore this home <span aria-hidden="true">↗</span></a></div>
</article>
